name: stack

# Boots the whole docker-compose stack with a throw-away service and proves logs, traces and metrics are
# correlated (tools/stack_check.sh). Slow (pulls images), so it runs nightly and on demand — not on every PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  stack-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: ./tools/stack_check.sh
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
