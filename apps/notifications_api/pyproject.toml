[project]
name = "notifications-api"
version = "0.1.0"
description = "Runs the notifications service alone (extraction drill / first step of real extraction)."
requires-python = ">=3.12"
dependencies = [
    "notifications-service",
    "platform-http",
    "platform-observability",
    "platform-security",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifications_api"]

[tool.uv.sources]
notifications-service = { workspace = true }
platform-http = { workspace = true }
platform-observability = { workspace = true }
platform-security = { workspace = true }
