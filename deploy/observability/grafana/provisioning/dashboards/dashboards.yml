apiVersion: 1
providers:
  - name: platform
    folder: Platform
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options: {path: /var/lib/grafana/dashboards/platform}
  - name: services
    folder: Services
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/services
      foldersFromFilesStructure: true      # services/<name>/observability/dashboards -> folder <name>
