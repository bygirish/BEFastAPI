# Single-binary Tempo with local disk storage (dev). Production: object storage + replicas.
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 72h        # local default: traces are kept 3 days
storage:
  trace:
    backend: local
    wal: {path: /var/tempo/wal}
    local: {path: /var/tempo/blocks}
