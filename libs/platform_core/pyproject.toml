[project]
name = "platform-core"
version = "0.1.0"
description = "Shared kernel: settings base, errors, ids, clock, DI container, health model, DB helpers. Business-agnostic."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
