[project]
name = "platform-events"
version = "0.1.0"
description = "Integration events: base model, EventBus port, in-process bus, transactional outbox + relay, idempotent handlers."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "platform-observability",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_events"]

[tool.uv.sources]
platform-core = { workspace = true }
platform-observability = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "aiosqlite>=0.20"]
