[project]
name = "platform-http"
version = "0.1.0"
description = "HTTP edge: uniform error handling, ServiceModule contract, outbound service client base."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "platform-events",
    "platform-observability",
    "fastapi>=0.146",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_http"]

[tool.uv.sources]
platform-core = { workspace = true }
platform-events = { workspace = true }
platform-observability = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
