[project]
name = "platform-observability"
version = "0.1.0"
description = "OpenTelemetry setup, structured JSON logging with redaction, metrics/tracing helpers, health endpoints."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "structlog>=24.1",
    "starlette>=0.37",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_observability"]

[tool.uv.sources]
platform-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "fastapi>=0.146"]
