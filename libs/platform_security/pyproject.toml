[project]
name = "platform-security"
version = "0.1.0"
description = "Local JWT verification (JWKS), Principal, and FastAPI authorization dependencies. Verifies tokens; never issues them."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "platform-observability",
    "pyjwt[crypto]>=2.9",
    "fastapi>=0.111",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_security"]

[tool.uv.sources]
platform-core = { workspace = true }
platform-observability = { workspace = true }
platform-http = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "cryptography>=43", "platform-http"]
