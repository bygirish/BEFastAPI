[project]
name = "befastapi"
version = "0.1.0"
description = "Extraction-ready modular monolith (FastAPI). Workspace root: tooling only, no runtime code."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# Every directory matched here must contain a pyproject.toml.
# Services are added by tools/new_service.py (see tools/sync_workspace.py).
members = [
    "libs/*",
    "apps/*",
    # >>> generated:workspace-members (tools/sync_workspace.py)
    # <<< generated:workspace-members
]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "redis>=5.0",  # import-linter needs every package named in .importlinter to be importable
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:platform_.*", "error::DeprecationWarning:.*_service"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ contains illustrative Python snippets in Markdown; ruff would otherwise reformat/lint them.
extend-exclude = ["tools/templates", "docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "C4", "PT",
    "S",     # bandit
    "T20",   # no print()  (O-2)
    "TID",   # tidy imports: banned relative imports (S-4), banned APIs
    "ANN",   # annotations (S-2)
    "BLE",   # blind except must be justified with a noqa comment
]
ignore = [
    "ANN401",
    "E501",   # the formatter owns line length; long docstrings/comments are allowed
    "S101",   # assert is used for type narrowing only
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Security"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"ddtrace".msg = "Vendor telemetry SDKs are banned (O-1/AP-30). Use OpenTelemetry via platform_observability."
"newrelic".msg = "Vendor telemetry SDKs are banned (O-1/AP-30). Use OpenTelemetry via platform_observability."
"sentry_sdk".msg = "Initialise error tracking only inside platform_observability (O-1)."

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "ANN", "PT011", "PT018", "SIM117", "B008", "BLE001"]
"tools/**" = ["T20", "S603", "S607"]
"**/migrations/**" = ["ANN", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["platform_*", "monolith_app", "*_service", "*_contracts", "*_api"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
# DI container binds Protocol classes as keys: `bind(SomePort, impl)` is intentional.
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "alembic.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true
