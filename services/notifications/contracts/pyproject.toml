[project]
name = "notifications-contracts"
version = "0.1.0"
description = "Public, versioned contract of the notifications service: DTOs, Protocols, events, errors, HTTP client."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
    "platform-events",
    "platform-http",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifications_contracts"]

[tool.uv.sources]
platform-core = { workspace = true }
platform-events = { workspace = true }
platform-http = { workspace = true }
