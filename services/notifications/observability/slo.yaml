# SLO definitions for the notifications service (see docs/architecture/OBSERVABILITY.md §8).
service: notifications
slos:
  - name: availability
    description: Non-5xx responses on public routes (4xx excluded)
    objective: 99.9
    window: 30d
  - name: latency
    description: Requests faster than the threshold on public routes
    objective: 99.0
    window: 30d
    threshold_seconds: 0.5
  # A business SLO: the HTTP layer can be perfectly healthy while no message is actually delivered.
  - name: delivery
    kind: counter_ratio
    description: Deliveries where at least one provider accepted the message (a rejected recipient is the caller's fault and is not counted as bad)
    metric: notifications_delivery_total
    bad: {outcome: failed}
    objective: 99.5
    window: 30d
