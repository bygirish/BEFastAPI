[project]
name = "notifications-service"
version = "0.1.0"
description = "Notifications service (private implementation). Public surface: notifications-contracts."
requires-python = ">=3.12"
dependencies = [
    "notifications-contracts",
    "platform-core",
    "platform-events",
    "platform-http",
    "platform-observability",
    "platform-security",
    "fastapi>=0.146",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.entry-points."befastapi.services"]
notifications = "notifications_service.module:build_module"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifications_service"]

[tool.uv.sources]
notifications-contracts = { workspace = true }
platform-core = { workspace = true }
platform-events = { workspace = true }
platform-http = { workspace = true }
platform-observability = { workspace = true }
platform-security = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "cryptography>=43",
]
